name: CI

# Build e testes do domus em todo PR e push na main.
# Todas as dependências kubex (kbx, logz, ethyr) vêm do proxy de módulos por
# tag: nenhum clone de módulo irmão nem secret é necessário.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
